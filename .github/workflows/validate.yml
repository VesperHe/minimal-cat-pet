name: Validate

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - name: Build Universal 2 app
        run: |
          chmod +x macos/build-universal.sh
          ./macos/build-universal.sh
      - name: Verify app bundle
        run: |
          file "macos/build/猫咪桌宠.app/Contents/MacOS/CatPet"
          codesign --verify --deep --strict --verbose=2 "macos/build/猫咪桌宠.app"
          plutil -lint "macos/build/猫咪桌宠.app/Contents/Info.plist"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse PowerShell source
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "windows/CatPet.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Verify Windows package files
        shell: powershell
        run: |
          $required = @(
            "windows/CatPet.ps1",
            "windows/Start-CatPet.bat",
            "windows/Install-CatPet.bat",
            "windows/Uninstall-CatPet.bat",
            "windows/Resources/sleep_0.png",
            "windows/Resources/sleep_1.png"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            throw "Missing required files: $($missing -join ', ')"
          }
